services:
  app:
    build: .
    container_name: adaptive-learning-platform
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=production_super_secret_jwt_key_2026
    volumes:
      - app-data:/app/server/data
    restart: unless-stopped

volumes:
  app-data:
